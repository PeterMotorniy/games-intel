[project]
name = "games-intel-scrape-metacritic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "games-intel-adapters-metacritic",
    "games-intel-db",
    "games-intel-settings",
    "playwright>=1.48",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
games-intel-scrape-metacritic = "games_intel.scrape.metacritic.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/games_intel"]
