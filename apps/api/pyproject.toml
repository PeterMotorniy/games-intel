[project]
name = "games-intel-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "games-intel-adapters-media",
    "games-intel-contracts",
    "games-intel-db",
    "games-intel-kafka",
    "games-intel-settings",
    "httpx>=0.27",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
games-intel-api = "games_intel.api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/games_intel"]
