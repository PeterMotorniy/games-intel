[project]
name = "games-intel-similarity"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "games-intel-adapters-embeddings",
    "games-intel-contracts",
    "games-intel-db",
    "games-intel-kafka",
    "games-intel-settings",
]

[project.scripts]
games-intel-similarity = "games_intel.workers.similarity.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/games_intel"]
