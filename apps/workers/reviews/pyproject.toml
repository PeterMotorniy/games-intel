[project]
name = "games-intel-reviews"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "games-intel-adapters-metacritic",
    "games-intel-agents-review-summarizer",
    "games-intel-contracts",
    "games-intel-db",
    "games-intel-kafka",
    "games-intel-settings",
    "langchain>=1.4.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[project.scripts]
games-intel-reviews = "games_intel.workers.reviews.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/games_intel"]
