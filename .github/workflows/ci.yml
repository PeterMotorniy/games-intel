name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Schema drift
        run: uv run python -m games_intel.contracts.generate --check
      - name: OpenAPI drift
        run: uv run python -m games_intel.api.openapi --check
      - name: Compose config
        env:
          POSTGRES_PASSWORD: ci
          GAMES_INTEL__KAFKA__SASL_PASSWORD: ci
        run: docker compose -f infra/compose/compose.yaml -f infra/compose/compose.prod.yaml config >/dev/null

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
