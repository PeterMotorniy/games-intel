[project]
name = "games-intel-adapters-media"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "games-intel-settings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = [
  "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/games_intel"]

[tool.hatch.build.targets.wheel.force-include]
"src/games_intel/adapters/media" = "games_intel/adapters/media"
