[project]
name = "games-intel-adapters-youtube"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "games-intel-contracts",
    "games-intel-settings",
    "httpx>=0.27",
    "youtube-transcript-api>=1.0",
    "yt-dlp>=2024.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/games_intel"]
