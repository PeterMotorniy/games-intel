[project]
name = "games-intel-agents-review-summarizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "games-intel-contracts",
    "games-intel-settings",
    "langchain>=1.4.0",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.0.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/games_intel"]

[tool.hatch.build.targets.wheel.force-include]
"prompts/prompt.md" = "games_intel/agents/review_summarizer/prompts/prompt.md"
